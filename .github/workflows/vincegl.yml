name: vincegl
# libvince-gl.dylib, libvince-inject.dylib and the backboardd wrapper (GPU rendering for the window server),
# built with Xcode's clang (userland/gpu/mk-gl-ci.sh). Run by hand; the result is the artifact "vincegl-ios".
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label (macos-15; macos-15-intel is another queue when the arm64 one is backed up)
        default: macos-15

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          bash userland/gpu/mk-gl-ci.sh 2>&1 | tee gl-build.log
      - name: Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vincegl-log
          path: gl-build.log
      - name: Result
        uses: actions/upload-artifact@v4
        with:
          name: vincegl-ios
          path: build-gl/out/
